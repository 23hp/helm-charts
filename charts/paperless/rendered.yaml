---
# Source: paperless/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  labels:
    helm.sh/chart: paperless-0.1.0
    app.kubernetes.io/name: paperless
    app.kubernetes.io/instance: paperless
    app.kubernetes.io/version: "3.1.3"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
      app.kubernetes.io/instance: paperless
  template:
    metadata:
      labels:
        helm.sh/chart: paperless-0.1.0
        app.kubernetes.io/name: paperless
        app.kubernetes.io/instance: paperless
        app.kubernetes.io/version: "3.1.3"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: paperless
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: docker.io/busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /usr/src/paperless/data /usr/src/paperless/media /usr/src/paperless/consume /usr/src/paperless/export"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /usr/src/paperless/consume
              name: consume-volume
            - mountPath: /usr/src/paperless/data
              name: data-volume
            - mountPath: /usr/src/paperless/export
              name: export-volume
            - mountPath: /usr/src/paperless/media
              name: media-volume
      containers:
        - name: valkey
          image: "docker.io/valkey/valkey:9-alpine"
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        - name: tika
          image: "docker.io/apache/tika:3.3.1.0"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        - name: gotenberg
          image: "docker.io/gotenberg/gotenberg:8.34"
          args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        - name: paperless
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          image: "ghcr.io/paperless-ngx/paperless-ngx:3.1.3"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: secret-key
            - name: PAPERLESS_OCR_LANGUAGE
              value: "deu+eng"
            - name: PAPERLESS_REDIS
              value: "redis://127.0.0.1:6379"
            - name: PAPERLESS_TIKA_ENABLED
              value: "1"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: "http://127.0.0.1:9998"
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: "http://127.0.0.1:3000"
            - name: PAPERLESS_TIME_ZONE
              value: "Europe/Berlin"
            - name: PAPERLESS_URL
              value: "http://paperless.internal"
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /usr/src/paperless/consume
              name: consume-volume
            - mountPath: /usr/src/paperless/data
              name: data-volume
            - mountPath: /usr/src/paperless/export
              name: export-volume
            - mountPath: /usr/src/paperless/media
              name: media-volume
      volumes:
        - name: consume-volume
          persistentVolumeClaim:
            claimName: consume-pvc
        - name: data-volume
          persistentVolumeClaim:
            claimName: data-pvc
        - name: export-volume
          persistentVolumeClaim:
            claimName: export-pvc
        - name: media-volume
          persistentVolumeClaim:
            claimName: media-pvc
